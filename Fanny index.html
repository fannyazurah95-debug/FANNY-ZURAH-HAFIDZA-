<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FANNY ZURAH HAFIDZA ABSEN 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 pb-20">
    <header class="bg-violet-700 text-white p-4 flex justify-between items-center sticky top-0 shadow z-40">
        <h1 class="font-bold text-xs md:text-sm"><i class="fa-solid fa-shirt"></i> FANNY ZURAH HAFIDZA ABSEN 12</h1>
        <button onclick="toggleCart()" class="relative bg-violet-800 px-3 py-1.5 rounded-full text-xs">
            <i class="fa-solid fa-shopping-cart"></i> <span id="badge" class="bg-pink-500 text-xs px-1.5 rounded-full">0</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4">
        <h2 class="font-bold text-gray-700 mb-3 text-sm">Katalog Baju & Celana Perempuan</h2>
        <div id="grid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="cart" class="fixed inset-0 bg-black/50 hidden flex justify-end z-50">
        <div class="bg-white w-full max-w-sm h-full flex flex-col justify-between p-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold">Keranjang Belanja</h3>
                <button onclick="toggleCart()" class="text-xl font-bold">&times;</button>
            </div>
            <div id="items" class="flex-1 overflow-y-auto space-y-2 py-2 text-xs"></div>
            <div class="border-t pt-3 space-y-2 text-xs">
                <div class="flex justify-between font-bold text-sm"><span>Total:</span><span id="total" class="text-violet-700">Rp 0</span></div>
                <input type="text" id="name" placeholder="Nama Lengkap" class="w-full border p-2 rounded">
                <textarea id="address" placeholder="Alamat Pengiriman" class="w-full border p-2 rounded" rows="2"></textarea>
                <button onclick="checkout()" class="w-full bg-violet-700 text-white font-bold py-2.5 rounded"><i class="fa-brands fa-whatsapp"></i> Pesan via WA</button>
            </div>
        </div>
    </div>

    <script>
        // Katalog Produk Baju & Celana Perempuan (Harga Seratus Ribuan)
        const products = [
            { id: 1, name: "Blouse Korean Style", price: 125000, img: "https://images.unsplash.com/photo-1551163943-3f6a855d1151?w=200" },
            { id: 2, name: "Culotte Pants Highwaist", price: 145000, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=200" },
            { id: 3, name: "Kemeja Oversize Linen", price: 135000, img: "https://images.unsplash.com/photo-1589465715568-a3f2d256cd8d?w=200" },
            { id: 4, name: "Jeans Loose Fit Wanita", price: 175000, img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=200" },
            { id: 5, name: "Dress Casual Elegan", price: 195000, img: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=200" },
            { id: 6, name: "Ripped Jeans Trendy", price: 165000, img: "https://images.unsplash.com/photo-1565084888270-aca6317bc2d2?w=200" }
        ];
        let cart = [];
        let sellerWA = "6282292322089"; // Nomor WA Penjual
        const formatRp = (n) => "Rp " + n.toLocaleString("id-ID");

        function render() {
            document.getElementById("grid").innerHTML = products.map(p => `
                <div class="bg-white p-2 rounded shadow-sm border text-center flex flex-col justify-between">
                    <img src="${p.img}" class="w-full h-28 object-cover rounded mb-2">
                    <div>
                        <p class="font-medium text-xs">${p.name}</p>
                        <p class="text-violet-700 font-bold text-xs my-1">${formatRp(p.price)}</p>
                    </div>
                    <button onclick="add(${p.id})" class="w-full bg-violet-50 text-violet-700 text-xs py-1 rounded border border-violet-200 mt-1">+ Keranjang</button>
                </div>
            `).join("");
        }

        function add(id) {
            let item = cart.find(i => i.id === id);
            if (item) item.qty++; else cart.push({...products.find(p => p.id === id), qty: 1});
            update();
        }

        function update() {
            document.getElementById("badge").innerText = cart.reduce((a, b) => a + b.qty, 0);
            document.getElementById("items").innerHTML = cart.map(i => `
                <div class="flex justify-between items-center border-b pb-1">
                    <div><b>${i.name}</b><br>${formatRp(i.price)} x ${i.qty}</div>
                    <button onclick="sub(${i.id})" class="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
                </div>
            `).join("") || '<p class="text-center text-gray-400">Keranjang kosong</p>';
            let tot = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById("total").innerText = formatRp(tot);
        }

        function sub(id) {
            let item = cart.find(i => i.id === id);
            if(item) { item.qty--; if(item.qty <= 0) cart = cart.filter(i => i.id !== id); }
            update();
        }

        function toggleCart() { document.getElementById("cart").classList.toggle("hidden"); }

        function checkout() {
            if (cart.length === 0) return alert("Keranjang kosong!");
            let name = document.getElementById("name").value.trim();
            let address = document.getElementById("address").value.trim();
            if (!name || !address) return alert("Isi nama dan alamat!");

            let text = `*PESANAN BARU PAKAIAN WANITA*\\nNama: ${name}\\nAlamat: ${address}\\n\\n*Detail Pesanan:*\\n`;
            cart.forEach((i, idx) => text += `${idx+1}. ${i.name} (${i.qty}x) = ${formatRp(i.price * i.qty)}\\n`);
            
            window.open(`https://wa.me/${sellerWA}?text=${encodeURIComponent(text)}`, "_blank");
        }
        render();
    </script>
</body>
</html>
